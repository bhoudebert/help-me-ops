# The MCP server over HTTP for a team (ADR 0016).
#
#   1. a token per person:   npm run ops -- token alice   >> ops-tokens.txt
#      (the line for the server, a hash, goes to the file; the secret is shown on the
#      terminal, once, for you to give to alice)
#   2. your workspace:       OPS_WORKSPACE_DIR=./my-workspace (default: the demo)
#   3. the credentials your sources read (${VAR} in ops.config.json): server.env
#   4. docker compose up -d --build
#
# Clients connect to http://localhost:8808/mcp with "Authorization: Bearer <token>".
# For a team, put a proxy with TLS in front, set OPS_PUBLIC_HOST to the name people
# use (mcp.company.example) and publish the port only to the proxy.
services:
  help-me-ops:
    build: .
    ports:
      # Loopback only, until you have TLS in front and tokens you trust.
      - "127.0.0.1:8808:8808"
    environment:
      # The names the server is reached by: its Host header must be one of them.
      OPS_MCP_PUBLIC_HOSTS: ${OPS_PUBLIC_HOST:-localhost:8808}
      OPS_MCP_TOKENS_FILE: /run/secrets/ops_tokens
    # To let people sign in with the company login instead of (or beside) tokens, add:
    #   OPS_MCP_OAUTH_ISSUER: https://login.company.example/realms/ops
    #   OPS_MCP_PUBLIC_URL: https://mcp.company.example/mcp
    #   (and OPS_MCP_OAUTH_JWKS_URI, _AUDIENCE, _SCOPES: see the guide, "One server for the team")
    env_file:
      - path: ./server.env
        required: false
    volumes:
      # Config, playbooks, knowledge and your own addons live outside the image.
      - ${OPS_WORKSPACE_DIR:-./examples/my-workspace}:/workspace:ro
    secrets:
      - ops_tokens
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # --- A test identity provider, to try "sign in with the company login" ----------------
  #
  #   docker compose --profile keycloak up -d --build keycloak help-me-ops-oauth
  #
  # Keycloak (admin / admin on http://localhost:8080, realm "ops", users alice/alice and
  # bob/bob, for tests only) and a second help-me-ops that trusts it, on http://localhost:8809/mcp.
  # It shares Keycloak's network so that "localhost:8080" is the same Keycloak for the browser
  # and for the server: the issuer in a token and the address the server fetches the keys from
  # are then one. Real setups have a name for the provider and do not need this.
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
      # the second help-me-ops, which lives in this network
      - "127.0.0.1:8809:8808"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  help-me-ops-oauth:
    profiles: ["keycloak"]
    build: .
    network_mode: "service:keycloak"
    depends_on:
      - keycloak
    environment:
      OPS_MCP_OAUTH_ISSUER: http://localhost:8080/realms/ops
      OPS_MCP_PUBLIC_URL: http://localhost:8809/mcp
      OPS_MCP_PUBLIC_HOSTS: localhost:8809
      OPS_MCP_OAUTH_SCOPES: help-me-ops
    volumes:
      - ${OPS_WORKSPACE_DIR:-./examples/my-workspace}:/workspace:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Keycloak takes a while to start: the server refuses to start without its provider, and tries again.
    restart: on-failure

secrets:
  ops_tokens:
    file: ./ops-tokens.txt
