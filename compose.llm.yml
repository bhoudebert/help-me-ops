# A local model server for `ops chat`, `ask` and `eval`, if you have no Ollama:
#
#   docker compose -f compose.llm.yml up -d
#   docker compose -f compose.llm.yml exec ollama ollama pull qwen3:8b
#   npm run ops -- chat --model qwen3:8b --base-url http://localhost:11434/v1
#
# Models live in the `ollama` volume, so they are downloaded once. On a machine
# with an NVIDIA card and the NVIDIA container toolkit, uncomment the GPU lines;
# without them it runs on the CPU, which works and is slow.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Ollama's default context is small; the method and the tools take ~2,400 tokens.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
