name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/guide/**", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the guide into the site, at /guide/
        run: npm run docs:build && cp -r docs/guide/.vitepress/dist site/guide
      - uses: actions/configure-pages@v6
      # One artifact name per attempt: re-running a failed job uploads again to the same run, and
      # deploy-pages refuses a run holding two artifacts of the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
