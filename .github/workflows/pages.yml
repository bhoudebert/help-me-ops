name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/guide/**", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages workflow has: the deploy asks for the artifact on
  # another runner, a few seconds after the upload. In one job it asked 300 ms after
  # the upload, sometimes before GitHub listed the artifact ("No artifacts named
  # github-pages were found"), and the run failed with the site not deployed.
  # It also lets a failed deploy be re-run alone, without uploading a second artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the guide into the site, at /guide/
        run: npm run docs:build && cp -r docs/guide/.vitepress/dist site/guide
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
