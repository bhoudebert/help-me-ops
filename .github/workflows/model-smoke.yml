name: Model smoke

# Manual only, and never a gate: it checks that `ops ask` talks to a real model
# server (the request, the tool calls, the answer), with a model far too small to
# investigate anything. Public repositories run on GitHub's free runners, on the
# CPU; the model is downloaded each time, so this is not part of CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Start a model server and pull a tiny model
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          docker exec ollama ollama pull qwen3:0.6b
      - name: Ask one question and check that the model was called and the tools ran
        run: |
          npm run ops -- ask "Client u-881 paid but cannot find order 4512 in production" \
            --workspace examples/my-workspace --base-url http://127.0.0.1:11434/v1 \
            --model qwen3:0.6b --reasoning none --max-steps 3 --json > result.json || true
          cat result.json
          jq -e '.steps >= 1' result.json
